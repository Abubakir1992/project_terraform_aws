name: Deploy React with Systems Manager
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["react-app/**", "scripts/deploy-react.sh", "scripts/archive-react.py"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: react-production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::295601546427:role/moto-github-deploy
          aws-region: us-east-1
      - run: terraform init -input=false
        working-directory: terraform-aws-webpage
      - run: bash scripts/deploy-react.sh
