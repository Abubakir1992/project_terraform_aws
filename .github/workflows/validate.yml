name: Validate motorcycle application
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build && npm test
        working-directory: react-app
      - run: python scripts/build-lambda.py
      - run: pwsh -NoProfile -File tests/powershell-api.ps1
      - run: pwsh -NoProfile -File tests/powershell-worker.ps1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive && terraform init -backend=false -input=false && terraform validate
        working-directory: terraform-aws-webpage
      - run: python tests/check_bootstrap.py
      - run: python tests/check_lengths.py
